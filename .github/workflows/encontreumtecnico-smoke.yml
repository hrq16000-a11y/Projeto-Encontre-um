name: Encontre um Técnico - validação de migração
on:
  push:
    branches:
      - feat/encontreumtecnico-migracao-vercel
    paths:
      - 'encontreumtecnico/**'
      - '.github/workflows/encontreumtecnico-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020c
        with:
          node-version: '22'
      - name: Install app dependencies
        working-directory: encontreumtecnico
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        working-directory: encontreumtecnico
        run: npm test
      - name: Discover original logo source (read-only)
        working-directory: encontreumtecnico
        continue-on-error: true
        run: node scripts/probe-brand.mjs
      - name: Capture authorized original logo and favicon bytes
        working-directory: encontreumtecnico
        continue-on-error: true
        run: node scripts/asset-capture.mjs
      - name: Read-only preview smoke (no fake registrations)
        env:
          URL: https://encontreumtecnico-migracao-1m9pweeeq-msolus.vercel.app
        run: |
          set -euo pipefail
          for path in / /cadastro /galeria /admin /acompanhar /meu-perfil /cliente /clientes /atividades /admin-portal /assets/logo-original.webp /assets/favicon-original.webp /api/health /api/tecnicos /api/profissionais /api/clientes /api/solicitacoes; do
            echo "GET $path"
            code=$(curl -sSL --retry 3 --retry-delay 2 --connect-timeout 7 --max-time 22 -o /tmp/response -w '%{http_code}' "$URL$path")
            test "$code" = "200" || { echo "Unexpected HTTP $code: $path"; exit 1; }
            if [ "$path" = "/api/health" ]; then
              cp /tmp/response /tmp/health.json
            fi
            if [ "$path" = "/api/profissionais" ]; then
              cp /tmp/response /tmp/origem.json
            fi
          done
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('cadastrosConfigurados') is True, "Vercel Blob não configurado no deploy"
          assert d.get('adminConfigurado') is True, "Painel administrativo não configurado no deploy"
          print("Health OK - armazenamento e administração habilitados")
          o=json.load(open('/tmp/origem.json'))
          profiles=o.get('profissionais',[])
          print('Galeria WordPress:',o.get('origem'),'perfis públicos:',len(profiles),'fontes válidas:',o.get('fontesValidas'))
          assert o.get('fontesValidas') == 2, "Falta um dos dois sitemaps de técnicos"
          assert len(profiles) >= 300, "A galeria está incompleta (menos de 300 URLs públicas)"
          assert len({x.get('url') for x in profiles}) == len(profiles), "Perfis duplicados encontrados"
          assert all(x.get('url','').startswith('https://encontreumtecnico.com/tecnico/') for x in profiles), "URLs fora da origem oficial"
          PY
          code=$(curl -sSL --connect-timeout 7 --max-time 22 -X POST -H 'Content-Type: application/json' -d '{"nome":"x"}' -o /tmp/invalid -w '%{http_code}' "$URL/api/cadastro")
          test "$code" = "400" || { echo "Validation failure: expected HTTP 400, got $code"; exit 1; }
          status_code=$(curl -sSL --connect-timeout 7 --max-time 22 -X POST -H 'Content-Type: application/json' -d '{"id":"invalid"}' -o /tmp/status_invalid -w '%{http_code}' "$URL/api/status")
          test "$status_code" = "400" || { echo "Status API validation: expected 400, got $status_code"; exit 1; }
          code=$(curl -sSL --connect-timeout 7 --max-time 22 -X POST -H 'Content-Type: application/json' -d '{"id":"invalid"}' -o /tmp/profile_invalid -w '%{http_code}' "$URL/api/perfil")
          test "$code" = "401" || { echo "Unauthorized profile access: expected 401, got $code"; exit 1; }
          client_code=$(curl -sSL --connect-timeout 7 --max-time 22 -X POST -H 'Content-Type: application/json' -d '{"acao":"cadastro"}' -o /tmp/invalid_client -w '%{http_code}' "$URL/api/cliente")
          test "$client_code" = "400" || { echo "Client validation expected 400, got $client_code"; exit 1; }
          request_code=$(curl -sSL --connect-timeout 7 --max-time 22 -X POST -H 'Content-Type: application/json' -d '{}' -o /tmp/invalid_request -w '%{http_code}' "$URL/api/solicitacoes")
          test "$request_code" = "400" || { echo "Service request validation expected 400, got $request_code"; exit 1; }
          admin_code=$(curl -sSL --connect-timeout 7 --max-time 22 -o /tmp/invalid_admin -w '%{http_code}' "$URL/api/admin-portal?tipo=cliente")
          test "$admin_code" = "401" || { echo "Admin access without credentials expected 401, got $admin_code"; exit 1; }
          mine_code=$(curl -sSL --connect-timeout 7 --max-time 22 -X POST -H 'Content-Type: application/json' -d '{"clienteId":"invalid"}' -o /tmp/invalid_mine -w '%{http_code}' "$URL/api/minhas-solicitacoes")
          test "$mine_code" = "401" || { echo "Private requests access expected 401, got $mine_code"; exit 1; }
          echo "Smoke checks passed, without writing a profile."

name: Encontre um Técnico - validação de migração
on:
  push:
    branches:
      - feat/encontreumtecnico-migracao-vercel
    paths:
      - 'encontreumtecnico/**'
      - '.github/workflows/encontreumtecnico-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020c
        with:
          node-version: '22'
      - name: Install app dependencies
        working-directory: encontreumtecnico
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        working-directory: encontreumtecnico
        run: npm test
      - name: Probe original WordPress public directory (metadata only)
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sSL --max-time 14 --retry 1 -A 'EncontreUmTecnico-Migracao/1.0' 'https://encontreumtecnico.com/wp-json/wp/v2/types' -o /tmp/wp-types || true
          curl -sSL --max-time 14 --retry 1 -A 'EncontreUmTecnico-Migracao/1.0' 'https://encontreumtecnico.com/lista-de-tecnicos/' -o /tmp/wp-directory || true
          python - <<'PY'
          import json,re,os
          try:
              j=json.load(open('/tmp/wp-types'))
              names=[(key,val.get('rest_base','')) for key,val in j.items() if re.search(r'candidate|tecnic|profission|jobsearch|listing',key,re.I)]
              print('Origem REST candidatos tipos:',names)
          except Exception: print('Origem REST tipos: indisponível')
          if os.path.exists('/tmp/wp-directory'):
              html=open('/tmp/wp-directory',encoding='utf-8',errors='replace').read()
              paths=set(re.findall(r'href=["\x27]([^"\x27]+/tecnico/[^"\x27]+)',html,re.I))
              print('Origem diretório HTML bytes:',len(html.encode('utf-8')),'links tecnicos únicos:',len(paths))
              anchors=re.findall(r'<a\\b[^>]*href=["\\x27][^"\\x27]*/tecnico/[^"\\x27]+["\\x27][^>]*>[\\s\\S]*?</a>',html,re.I)
              print('Amostra de estrutura de links públicos:',[(re.sub(r'\\s+',' ',x)[:350]) for x in anchors[:2]])
              print('Paginacao URL base exemplos:',list(dict.fromkeys(re.findall(r'href=["\\x27]([^"\\x27]*lista-de-tecnicos/\\?[^"\\x27]+)',html,re.I)))[:5])
          else: print('Origem diretório HTML indisponível')
          PY
      - name: Read-only preview smoke (no fake registrations)
        env:
          URL: https://encontreumtecnico-migracao-i6ky1sjda-msolus.vercel.app
        run: |
          set -euo pipefail
          for path in / /cadastro.html /galeria.html /admin.html /api/health /api/tecnicos /api/profissionais; do
            echo "GET $path"
            code=$(curl -sSL --retry 3 --retry-delay 2 --connect-timeout 7 --max-time 22 -o /tmp/response -w '%{http_code}' "$URL$path")
            test "$code" = "200" || { echo "Unexpected HTTP $code: $path"; exit 1; }
            if [ "$path" = "/api/health" ]; then
              cp /tmp/response /tmp/health.json
            fi
            if [ "$path" = "/api/profissionais" ]; then
              cp /tmp/response /tmp/origem.json
            fi
          done
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('cadastrosConfigurados') is True, "Vercel Blob não configurado no deploy"
          assert d.get('adminConfigurado') is True, "Painel administrativo não configurado no deploy"
          print("Health OK - armazenamento e administração habilitados")
          o=json.load(open('/tmp/origem.json'))
          print('Galeria Wordpress fonte:',o.get('origem'),'perfis retornados:',len(o.get('profissionais',[])))
          PY
          code=$(curl -sSL --connect-timeout 7 --max-time 22 -X POST -H 'Content-Type: application/json' -d '{"nome":"x"}' -o /tmp/invalid -w '%{http_code}' "$URL/api/cadastro")
          test "$code" = "400" || { echo "Validation failure: expected HTTP 400, got $code"; exit 1; }
          echo "Smoke checks passed, without writing a profile."
